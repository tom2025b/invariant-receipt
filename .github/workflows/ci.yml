name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out the committed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable at 2026-10-16
        with:
          toolchain: 1.99.1

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.149 --locked

      - name: Install Invariant Receipt and development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Lint and check formatting
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Run the complete test suite
        run: .venv/bin/python -m pytest

      - name: Confirm the development gate left the source tree clean
        run: test -z "$(git status --porcelain)"

      - name: Run the self-dogfooding invariants
        if: matrix.python-version == '3.14'
        run: |
          mkdir -p "$RUNNER_TEMP/invariant-receipt-work"
          .venv/bin/invariant-receipt run invariants.yaml \
            --repeat 3 \
            --out "$RUNNER_TEMP/invariant-receipt-receipts" \
            --workdir "$RUNNER_TEMP/invariant-receipt-work"
